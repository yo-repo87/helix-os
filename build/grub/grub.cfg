# Helix OS — GRUB Boot Menu
# Supports both BIOS (grub-pc) and UEFI (grub-efi).
# The USB partition is labeled HELIXBOOT; grub finds it via search.

set default=0
set timeout=5
set timeout_style=menu

# Find our boot partition by label and set $root
search --no-floppy --label --set=root HELIXBOOT

# ── User boot parameters (managed by Settings/VMs UI, editable by hand) ────────
# /config/boot-params.cfg on the boot partition may set:
#   helix_iommu=auto   add intel_iommu=on amd_iommu=on iommu=pt (default). Each
#                      vendor's flag is ignored by the other vendor's hardware,
#                      so no CPU detection is needed. "off" disables it.
#   helix_extra="..."  extra kernel arguments appended to the normal entries.
set helix_iommu=auto
set helix_extra=""
if [ -f /config/boot-params.cfg ]; then
    source /config/boot-params.cfg
fi
set helix_kargs=""
if [ "$helix_iommu" != "off" ]; then
    set helix_kargs="intel_iommu=on amd_iommu=on iommu=pt"
fi
if [ -n "$helix_extra" ]; then
    set helix_kargs="$helix_kargs $helix_extra"
fi

# Terminals: VGA/console for a normal screen + serial for headless VMs. Both are
# active so the menu shows and auto-boots whether the VM has a display or serial.
serial --unit=0 --speed=115200
if loadfont /grub/fonts/unicode.pf2; then
    insmod all_video
    insmod gfxterm
    insmod png
    terminal_input console serial
    terminal_output gfxterm console serial
    background_image /grub/splash.png
else
    terminal_input console serial
    terminal_output console serial
fi

# ── Color scheme (Unraid-style dark + orange accent) ──────────────────────────
set color_normal=white/black
set color_highlight=black/light-gray
set menu_color_normal=cyan/black
set menu_color_highlight=white/black

menuentry "Helix OS" --class helix {
    insmod gzio
    insmod squash4
    insmod part_gpt
    insmod part_msdos
    insmod fat
    linux  /boot/vmlinuz quiet splash boot=helix helix_label=HELIXBOOT console=ttyS0,115200 console=tty0 $helix_kargs
    initrd /boot/initrd.img
}

menuentry "Helix OS (verbose)" --class helix {
    insmod gzio
    linux  /boot/vmlinuz boot=helix helix_label=HELIXBOOT console=ttyS0,115200 console=tty0 $helix_kargs
    initrd /boot/initrd.img
}

menuentry "Helix OS (safe mode — no plugins)" --class helix {
    insmod gzio
    linux  /boot/vmlinuz boot=helix helix_label=HELIXBOOT helixsafemode
    initrd /boot/initrd.img
}

menuentry "Helix OS (previous version)" --class helix {
    insmod gzio
    linux  /boot/vmlinuz boot=helix helix_label=HELIXBOOT helix_prev=1 $helix_kargs
    initrd /boot/initrd.img.prev
}

menuentry "Memory Test (Memtest86+)" --class memtest {
    linux16 /boot/memtest86+.bin
}
