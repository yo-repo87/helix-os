# Helix OS Samba config — /boot/config/samba.cfg
# Applied by helix-samba-apply on every share change.

[samba]
WORKGROUP=WORKGROUP
DESCRIPTION=Helix OS NAS
MIN_PROTOCOL=SMB2

# AD domain integration (leave blank for standalone/workgroup mode)
# DOMAIN=
# DC_IP=
# ADMIN_USER=Administrator

# Local Samba users (comma-separated; must also be Linux users)
# USERS=pi,john
