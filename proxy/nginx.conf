# Helix OS web server (OpenResty), CLAUDE.md §54.
# Based on Nginx Proxy Manager's nginx.conf (its generated host configs rely on the maps, log
# formats and include points below), adapted to Helix:
#  - the Helix web UI (sites-enabled/helix, https in helix-https.d) is the DEFAULT server on
#    :80/:443; NPM hosts only match their own names (NPM's "Default Site" is patched to never
#    claim default_server);
#  - every /data path is optional, so nginx starts when NPM is off or /data is empty (RAM mode);
#  - started by nginx.service (daemon on, pid /run/nginx.pid), master root, workers www-data
#    (/data is group www-data so workers can read access lists and ACME challenge files).
user www-data;
worker_processes auto;
pcre_jit on;
pid /run/nginx.pid;
error_log /var/log/nginx/error.log warn;

include /data/nginx/custom/root_top[.]conf;

events {
	worker_connections 1024;
	include /data/nginx/custom/events[.]conf;
}

http {
	include                       /etc/nginx/mime.types;
	default_type                  application/octet-stream;
	sendfile                      on;
	server_tokens                 off;
	tcp_nopush                    on;
	tcp_nodelay                   on;
	types_hash_max_size           2048;
	client_body_temp_path         /var/lib/nginx/body 1 2;
	proxy_temp_path               /var/lib/nginx/proxy;
	fastcgi_temp_path             /var/lib/nginx/fastcgi;
	uwsgi_temp_path               /var/lib/nginx/uwsgi;
	scgi_temp_path                /var/lib/nginx/scgi;
	keepalive_timeout             90s;
	proxy_connect_timeout         90s;
	proxy_send_timeout            90s;
	proxy_read_timeout            90s;
	ssl_prefer_server_ciphers     on;
	gzip                          on;
	proxy_ignore_client_abort     off;
	client_max_body_size          2000m;
	server_names_hash_bucket_size 1024;
	proxy_http_version            1.1;
	proxy_set_header              X-Forwarded-Scheme $scheme;
	proxy_set_header              X-Forwarded-For $proxy_add_x_forwarded_for;
	proxy_set_header              Accept-Encoding "";
	proxy_cache                   off;
	proxy_cache_path              /var/lib/nginx/cache/public  levels=1:2 keys_zone=public-cache:30m max_size=192m;
	proxy_cache_path              /var/lib/nginx/cache/private levels=1:2 keys_zone=private-cache:5m max_size=1024m;

	# Log formats ("proxy", "standard") + fallback access log (/data/logs is RAM: /var/log/npm)
	include /etc/nginx/conf.d/include/log-proxy[.]conf;
	# Resolvers, written from /etc/resolv.conf at boot by helix-npm-setup
	include /etc/nginx/conf.d/include/resolvers[.]conf;

	map "$host|$http_host" $forward_host {
		"~*^(?<fwd_name>[^|]+)\|\k<fwd_name>(?<fwd_port>:[0-9]+)$" "$host$fwd_port";
		default $host;
	}
	map $host $forward_scheme {
		default http;
	}
	map $http_x_forwarded_proto $x_forwarded_proto {
		"http" "http";
		"https" "https";
		default $scheme;
	}
	map $http_x_forwarded_scheme $x_forwarded_scheme {
		"http" "http";
		"https" "https";
		default $scheme;
	}

	# Real client IP from proxies on private networks (NPM default).
	set_real_ip_from 10.0.0.0/8;
	set_real_ip_from 172.16.0.0/12;
	set_real_ip_from 192.168.0.0/16;
	include conf.d/include/ip_ranges[.]conf;
	real_ip_header X-Real-IP;
	real_ip_recursive on;

	include /data/nginx/custom/http_top[.]conf;

	# Helix web UI (default server) and Helix's own generated configs
	include /etc/nginx/sites-enabled/*;
	include /etc/nginx/conf.d/*.conf;

	# Generated by NPM
	include /data/nginx/default_host/*.conf;
	include /data/nginx/proxy_host/*.conf;
	include /data/nginx/redirection_host/*.conf;
	include /data/nginx/dead_host/*.conf;
	include /data/nginx/temp/*.conf;

	include /data/nginx/custom/http[.]conf;
}

stream {
	include /etc/nginx/conf.d/include/log-stream[.]conf;
	include /data/nginx/stream/*.conf;
	include /data/nginx/custom/stream[.]conf;
}

include /data/nginx/custom/root[.]conf;
