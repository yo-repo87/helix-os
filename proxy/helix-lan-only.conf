# Only local networks may reach this server block (NPM admin UI on :81). CLAUDE.md §54.
# Note: a LAN client using a global IPv6 address is refused; use IPv4 or the server's IPv4 address.
allow 127.0.0.0/8;
allow 10.0.0.0/8;
allow 172.16.0.0/12;
allow 192.168.0.0/16;
allow 100.64.0.0/10;   # Tailscale
allow ::1;
allow fc00::/7;
allow fe80::/10;
deny all;
