# Helix OS — Disk Assignment Config
# /boot/config/disks.cfg  (lives on USB, persistent)
#
# Equivalent to Unraid's disks.cfg.
# Edit this file to assign drives to the array.
#
# RULES:
#   - parity drive must be >= largest data drive
#   - data drives must be formatted (xfs recommended)
#   - mountpoints are auto-created under /mnt/
#   - DO NOT mount data drives manually while array is running

# ── Parity drive(s) ───────────────────────────────────────────────────────────
# The parity file lives on a dedicated drive (or partition).
# Two parity entries = dual parity (tolerates 2 simultaneous failures).

[parity1]
device=/dev/sdb
# No filesystem — SnapRAID writes one large parity file directly

#[parity2]
#device=/dev/sdc

# ── Data drives ───────────────────────────────────────────────────────────────
# Each data drive is an independent XFS (or Btrfs/ext4) volume.
# Add as many [diskN] sections as you have drives.

[disk1]
device=/dev/sdc
format=xfs

[disk2]
device=/dev/sdd
format=xfs

[disk3]
device=/dev/sde
format=xfs

# ── Cache/pool drives (SSD only — not parity protected) ───────────────────────
# Cache drives use ZFS or Btrfs mirror for redundancy between themselves.
# Files are moved to the array by the mover on a schedule.

#[cache]
#device=/dev/nvme0n1
#format=xfs

# ── Share defaults ────────────────────────────────────────────────────────────
# Applied to all shares unless overridden in shares.cfg.

[sharedefaults]
# Which disks shares can use (comma-separated disk names, or "all")
included_disks=all
# Where new files land first: "prefer_first" | "most_free" | "fill_first"
allocation=most_free
# split_level: how deep mergerfs splits directories across drives
# 0 = never split (whole share on one disk) | 1 = top-level dirs may split | etc.
split_level=1
