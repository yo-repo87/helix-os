# Helix OS NFS config — /boot/config/nfs.cfg
# Applied by helix-nfs-apply on every share change.

[nfs]
# Which network can mount NFS shares (CIDR notation)
ALLOWED_NETWORK=192.168.0.0/16

# Default export options (applied to all NFS-enabled shares)
# rw           = read-write
# sync         = write to disk before replying (safer than async)
# no_subtree_check = less strict subtree checking (better reliability)
# no_root_squash   = root on client = root on server (needed for Docker volumes)
OPTIONS=rw,sync,no_subtree_check,no_root_squash

# NFSv4 domain (optional — needed for NFSv4 user ID mapping)
# DOMAIN=localdomain
