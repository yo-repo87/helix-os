# Helix OS — GRUB Boot Menu
# Supports both BIOS (grub-pc) and UEFI (grub-efi).
# The USB partition is labeled HELIXBOOT; grub finds it via search.

set default=0
set timeout=5
set timeout_style=menu

# Find our boot partition by label and set $root
search --no-floppy --label --set=root HELIXBOOT

# Load font for graphical menu
if loadfont /grub/fonts/unicode.pf2; then
    insmod gfxterm
    terminal_output gfxterm
fi

# ── Color scheme (Unraid-style dark + orange accent) ──────────────────────────
set color_normal=white/black
set color_highlight=black/light-gray
set menu_color_normal=cyan/black
set menu_color_highlight=white/black

menuentry "Helix OS" --class helix {
    insmod gzio
    insmod squash4
    insmod part_gpt
    insmod part_msdos
    insmod fat
    linux  /boot/vmlinuz quiet splash boot=helix helix_label=HELIXBOOT
    initrd /boot/initrd.img
}

menuentry "Helix OS (verbose)" --class helix {
    insmod gzio
    linux  /boot/vmlinuz boot=helix helix_label=HELIXBOOT
    initrd /boot/initrd.img
}

menuentry "Helix OS (safe mode — no plugins)" --class helix {
    insmod gzio
    linux  /boot/vmlinuz boot=helix helix_label=HELIXBOOT helixsafemode
    initrd /boot/initrd.img
}

menuentry "Helix OS (previous version)" --class helix {
    insmod gzio
    linux  /boot/vmlinuz boot=helix helix_label=HELIXBOOT helix_prev=1
    initrd /boot/initrd.img.prev
}

menuentry "Memory Test (Memtest86+)" --class memtest {
    linux16 /boot/memtest86+.bin
}
