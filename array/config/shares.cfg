# Helix OS — Share Config
# /boot/config/shares.cfg  (lives on USB, persistent)
#
# Each [sharename] section defines a user share visible at /mnt/user/<name>
# and exported via SMB/NFS.

[media]
comment=Media files
included_disks=all
allocation=most_free
split_level=2
smb=yes
nfs=yes
smb_security=public

[appdata]
comment=Docker application data
included_disks=disk1
allocation=fill_first
split_level=0
smb=no
nfs=no

[downloads]
comment=Download staging area
included_disks=disk1,disk2
allocation=most_free
split_level=1
smb=yes
nfs=no
smb_security=private
