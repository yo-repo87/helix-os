# Helix OS network config — /boot/config/network.cfg
# Applied at boot by helix-config-network.service → helix-apply-network.

# ── Primary interface ─────────────────────────────────────────────────────────
IFACE="eth0"
DHCP="yes"

# ── Static IP (used when DHCP=no) ────────────────────────────────────────────
IPADDR=""
NETMASK=""
GATEWAY=""
DNS1=""
DNS2=""

# ── Bonding (set BONDING=yes to bond multiple NICs) ──────────────────────────
BONDING="no"
BOND_MODE="active-backup"
BOND_SLAVES="eth0 eth1"

# ── Bridge (required for VM networking) ───────────────────────────────────────
BRIDGE="no"
BRNAME="br0"

# ── Hostname (overrides ident.cfg NAME for network identity) ─────────────────
# Leave blank to use NAME from ident.cfg.
HOSTNAME=""
