# Helix OS Network Config — /boot/config/network.cfg
# Applied by helix-apply-network on boot and whenever settings change.
# Changes take effect immediately (no reboot required).

[network]
# ── Primary interface ─────────────────────────────────────────────────────────
# Leave IFNAME blank to auto-detect the first non-loopback interface.
IFNAME=

# ── IP configuration ──────────────────────────────────────────────────────────
USE_DHCP=yes

# Static IP settings (ignored when USE_DHCP=yes)
IPADDR=
NETMASK=255.255.255.0
GATEWAY=
# Optional: override the hostname sent to the DHCP server
DHCP_HOSTNAME=

# ── DNS ───────────────────────────────────────────────────────────────────────
# Leave blank to accept DNS from DHCP
DNS_SERVER1=
DNS_SERVER2=
DOMAIN_NAME=

# ── MTU ───────────────────────────────────────────────────────────────────────
# 0 = use system default (usually 1500)
MTU=0

# ── Bonding (NIC teaming) ─────────────────────────────────────────────────────
# BONDING=yes to create a bond0 interface from BOND_MEMBERS
BONDING=no
BOND_NAME=bond0
# Space-separated interface names, e.g. "eth0 eth1"
BOND_MEMBERS=
# 802.3ad LACP=4, active-backup=1, balance-rr=0, balance-tlb=5
BONDING_MODE=1
BONDING_MIIMON=100

# ── Bridging (required for VM networking) ────────────────────────────────────
# BRIDGING=yes creates br0 bridging the primary interface (or bond).
# Docker and VMs attach to br0 for LAN access.
BRIDGING=no
BRIDGE_NAME=br0

# ── VLAN ─────────────────────────────────────────────────────────────────────
# Non-zero VLAN_ID tags the bridge/interface with 802.1q
VLAN_ID=0

# ── IPv6 ─────────────────────────────────────────────────────────────────────
# USE_DHCP6=auto tries SLAAC first, DHCPv6 fallback
# USE_DHCP6=no    disables IPv6 entirely
USE_DHCP6=auto
