# Helix OS Network Config — /boot/config/network.cfg
# Applied at boot by helix-config-network.service → helix-apply-network, and
# whenever you change network settings in the web UI. Edit and reboot (or
# re-run `helix-apply-network`) to apply.

[network]
# ── Primary interface ─────────────────────────────────────────────────────────
# Leave IFNAME blank to auto-detect the first non-loopback interface
# (e.g. eth0 or ens18 under Proxmox/KVM).
IFNAME=

# ── IP configuration ──────────────────────────────────────────────────────────
USE_DHCP=yes

# Static IP settings (used only when USE_DHCP=no)
IPADDR=
NETMASK=255.255.255.0
GATEWAY=
# Optional: override the hostname sent to the DHCP server
DHCP_HOSTNAME=

# ── DNS (leave blank to accept DNS from DHCP) ────────────────────────────────
DNS_SERVER1=
DNS_SERVER2=
DOMAIN_NAME=

# ── MTU (0 = system default, usually 1500) ───────────────────────────────────
MTU=0

# ── Bonding (NIC teaming) ─────────────────────────────────────────────────────
BONDING=no
BOND_NAME=bond0
# Space-separated member interfaces, e.g. "eth0 eth1"
BOND_MEMBERS=
# active-backup=1, balance-rr=0, 802.3ad LACP=4, balance-tlb=5
BONDING_MODE=1
BONDING_MIIMON=100

# ── Bridging (required for VM/Docker LAN networking) ─────────────────────────
BRIDGING=no
BRIDGE_NAME=br0

# ── VLAN (non-zero tags the bridge/interface with 802.1q) ────────────────────
VLAN_ID=0

# ── IPv6 (auto = SLAAC then DHCPv6; no = disable) ────────────────────────────
USE_DHCP6=auto
